# SOARsim — Render Blueprint
#
# Deploy both services to Render with one click:
#   1. Push this repo to GitHub
#   2. Go to https://dashboard.render.com/blueprints
#   3. Connect your repo — Render reads this file automatically
#   4. Both services deploy and communicate over Render's internal network
#
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── Backend: FastAPI physics engine ──────────────────────────────
  - type: web
    name: soarsim-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHON_VERSION
        value: "3.11"
      - key: CORS_ORIGINS
        value: "*"

  # ── Frontend: Next.js UI ────────────────────────────────────────
  - type: web
    name: soarsim-frontend
    env: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build && cp -r public .next/standalone/public && cp -r .next/static .next/standalone/.next/static
    startCommand: node .next/standalone/server.js
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: soarsim-backend
          type: web
          property: host
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=4096"
