# SOARsim — Render Blueprint
#
# Deploy both services to Render with one click:
#   1. Push this repo to GitHub
#   2. Go to https://dashboard.render.com/blueprints
#   3. Connect your repo — Render reads this file automatically
#   4. Both services deploy and communicate over Render's internal network
#
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── Backend: FastAPI physics engine ──────────────────────────────
  - type: web
    name: soarsim-backend
    env: python
    region: oregon
    plan: free
    # Commands run from repo root — cd into backend/ subdirectory
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHON_VERSION
        value: "3.11"
      # Allow all origins for initial deploy — restrict after verifying the frontend URL
      - key: CORS_ORIGINS
        value: "*"

  # ── Frontend: Next.js UI ────────────────────────────────────────
  - type: web
    name: soarsim-frontend
    env: node
    region: oregon
    plan: free
    # Commands run from repo root — cd into frontend/ subdirectory
    buildCommand: cd frontend && npm install && npm run build
    # Next.js standalone output places server.js in .next/standalone/
    startCommand: cd frontend && node .next/standalone/server.js
    envVars:
      # Point to the backend service via Render's internal DNS
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: soarsim-backend
          type: web
          property: host
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
