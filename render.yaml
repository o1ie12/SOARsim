# SOARsim — Render Blueprint
#
# Deploy both services to Render with one click:
#   1. Push this repo to GitHub
#   2. Go to https://dashboard.render.com/blueprints
#   3. Connect your repo — Render reads this file automatically
#   4. Both services deploy and communicate over Render's internal network
#
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── Backend: FastAPI physics engine ──────────────────────────────
  - type: web
    name: soarsim-backend
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: CORS_ORIGINS
        value: "*"

  # ── Frontend: Next.js UI ────────────────────────────────────────
  - type: web
    name: soarsim-frontend
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://soarsim-backend.onrender.com
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
